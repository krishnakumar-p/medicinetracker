# Builds, tests and publishes a signed release for every version tag (v1.2.3).
#
# Required repository (or "release" environment) secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of the upload/release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias inside the keystore
#   ANDROID_KEY_PASSWORD       key password
# See README.md > "Signed releases" for how to create and add them.
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Actions are pinned to commit SHAs: the release job handles the signing key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Unit, Robolectric and Compose UI tests + lint
        run: ./gradlew test testDebugUnitTest lintDebug --stacktrace

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 14

  release:
    name: Signed APKs + AAB
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tags must look like v1.2.3 (got '$tag')"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          if (( minor > 999 || patch > 999 )); then
            echo "::error::Minor and patch must be <= 999 to fit the versionCode scheme"
            exit 1
          fi
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 1000000 + minor * 1000 + patch ))" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Build signed APKs and App Bundle
        env:
          MEDISHELF_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          MEDISHELF_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MEDISHELF_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEDISHELF_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Two runs: AGP can't build the bundle alongside ABI-split APKs when shrinking resources.
        run: |
          versions="-PversionName=${{ steps.version.outputs.name }} -PversionCode=${{ steps.version.outputs.code }}"
          ./gradlew bundleRelease -PabiSplits=false $versions --stacktrace
          ./gradlew assembleRelease $versions --stacktrace

      - name: Verify, check offline guarantee, collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          out=app/build/outputs
          if ls "$out"/apk/release/*-unsigned.apk >/dev/null 2>&1; then
            echo "::error::Release APKs are unsigned; check the signing secrets"
            exit 1
          fi
          mkdir -p dist
          for apk in "$out"/apk/release/app-*-release.apk; do
            # Capture first: piping into head would SIGPIPE apksigner under pipefail.
            certs="$("$bt/apksigner" verify --print-certs "$apk")"
            sed -n '1,2p' <<<"$certs"
            # v1 promise: no network access. Fail the release if any library added it.
            if "$bt/aapt2" dump permissions "$apk" | grep -q 'android.permission.INTERNET'; then
              echo "::error::$apk requests INTERNET; the app must stay offline"
              exit 1
            fi
            abi="$(basename "$apk" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            cp "$apk" "dist/MediShelf-$VERSION-$abi.apk"
          done
          jarsigner -verify "$out/bundle/release/app-release.aab" >/dev/null
          cp "$out/bundle/release/app-release.aab" "dist/MediShelf-$VERSION.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: MediShelf ${{ steps.version.outputs.name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
